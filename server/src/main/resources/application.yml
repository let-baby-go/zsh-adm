server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:18890}
spring:
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 13MB
  datasource:
    url: ${JDBC_URL:jdbc:h2:file:./data/workdsh-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${JDBC_USER:sa}
    password: ${JDBC_PASSWORD:}
    # Connections are held per query only (gateway forwarding and streaming hold none). The enterprise-sqlite
    # profile keeps its single connection regardless of these values.
    hikari:
      maximum-pool-size: ${WORKDSH_DB_POOL_SIZE:10}
      connection-timeout: ${WORKDSH_DB_CONNECTION_TIMEOUT_MS:30000}
  sql:
    init:
      mode: always
  # Virtual threads (Java 21): request handling and response streaming block on upstream model I/O without
  # holding platform threads, so thousands of slow model calls do not starve the console or each other.
  # Concurrent model calls are bounded by workdsh.gateway.max-concurrent-requests instead of thread counts.
  threads:
    virtual:
      enabled: ${WORKDSH_VIRTUAL_THREADS:true}
  # Used only when virtual threads are disabled: grow instead of queueing behind Spring Boot's 8 default threads.
  task:
    execution:
      pool:
        core-size: 8
        max-size: ${WORKDSH_GATEWAY_MAX_CONCURRENT_REQUESTS:2000}
        queue-capacity: 0
        keep-alive: 60s
      thread-name-prefix: gateway-stream-
  mvc:
    # Longest single gateway response, streams included. The container default (30s on Tomcat) cut long
    # model answers short.
    async:
      request-timeout: ${WORKDSH_GATEWAY_MAX_RESPONSE_DURATION:30m}
    problemdetails:
      enabled: true
workdsh:
  gateway:
    connect-timeout: ${WORKDSH_GATEWAY_CONNECT_TIMEOUT:15s}
    response-timeout: ${WORKDSH_GATEWAY_RESPONSE_TIMEOUT:5m}
    stream-idle-timeout: ${WORKDSH_GATEWAY_STREAM_IDLE_TIMEOUT:5m}
    # Key → organization and provider configuration are cached; saves in this instance apply at once, changes
    # made through another instance appear within this TTL. 0 reads the database on every call.
    cache-ttl: ${WORKDSH_GATEWAY_CACHE_TTL:10s}
    # Model calls in progress (streaming or not) across all organizations; more are refused with 503 gateway_busy.
    max-concurrent-requests: ${WORKDSH_GATEWAY_MAX_CONCURRENT_REQUESTS:2000}
  # Desktop visible text: "database" keeps it in member_desktop_body_records; "s3" stores one object per
  # record in an S3-compatible bucket (AWS S3, MinIO, OSS, COS). migrate-existing moves inline text once.
  body-store:
    type: ${WORKDSH_BODY_STORE:database}
    migrate-existing: ${WORKDSH_BODY_STORE_MIGRATE:false}
    s3:
      endpoint: ${WORKDSH_BODY_S3_ENDPOINT:}
      region: ${WORKDSH_BODY_S3_REGION:us-east-1}
      bucket: ${WORKDSH_BODY_S3_BUCKET:}
      prefix: ${WORKDSH_BODY_S3_PREFIX:}
      access-key: ${WORKDSH_BODY_S3_ACCESS_KEY:}
      secret-key: ${WORKDSH_BODY_S3_SECRET_KEY:}
      path-style: ${WORKDSH_BODY_S3_PATH_STYLE:false}
  # Daily housekeeping: expired logins, organization body retention, capacity log.
  maintenance:
    cron: ${WORKDSH_MAINTENANCE_CRON:0 30 3 * * *}
    zone: ${WORKDSH_MAINTENANCE_ZONE:Asia/Shanghai}
  web:
    origin: ${WORKDSH_ADMIN_WEB_ORIGIN:http://127.0.0.1:18891}
  bootstrap:
    admin-email: ${WORKDSH_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${WORKDSH_BOOTSTRAP_ADMIN_PASSWORD:}
    organization-name: ${WORKDSH_ORGANIZATION_NAME:WorkDSH 企业}


  secrets:
    encryption-key: ${WORKDSH_SECRETS_ENCRYPTION_KEY:}
    service-key: ${WORKDSH_SECRETS_SERVICE_KEY:}
