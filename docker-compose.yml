# WorkDSH 管理后台默认栈：H2 文件库 + 内置管理前端，单容器。
# 企业式 PostgreSQL 验收请叠加：docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#
# 启动前：cp .env.example .env 并填写必填项。.env 已在 .gitignore 中。
name: workdsh-admin

x-admin-environment: &admin-environment
  BIND_ADDRESS: "0.0.0.0"
  PORT: "18890"
  # 必须等于浏览器实际访问的地址（含端口），否则登录等写请求会被 Origin 校验拒绝。
  WORKDSH_ADMIN_WEB_ORIGIN: ${WORKDSH_ADMIN_WEB_ORIGIN:-http://127.0.0.1:18890}
  WORKDSH_BOOTSTRAP_ADMIN_EMAIL: ${WORKDSH_BOOTSTRAP_ADMIN_EMAIL:?请先在 .env 中设置 WORKDSH_BOOTSTRAP_ADMIN_EMAIL}
  WORKDSH_BOOTSTRAP_ADMIN_PASSWORD: ${WORKDSH_BOOTSTRAP_ADMIN_PASSWORD:?请先在 .env 中设置 WORKDSH_BOOTSTRAP_ADMIN_PASSWORD（至少 12 位）}
  WORKDSH_ORGANIZATION_NAME: ${WORKDSH_ORGANIZATION_NAME:-WorkDSH 企业}
  WORKDSH_SECRETS_ENCRYPTION_KEY: ${WORKDSH_SECRETS_ENCRYPTION_KEY:?请先在 .env 中设置 WORKDSH_SECRETS_ENCRYPTION_KEY（32 字节随机密钥的 Base64）}
  WORKDSH_SECRETS_SERVICE_KEY: ${WORKDSH_SECRETS_SERVICE_KEY:?请先在 .env 中设置 WORKDSH_SECRETS_SERVICE_KEY}
  # 模型网关时限（可选）
  WORKDSH_GATEWAY_CONNECT_TIMEOUT: ${WORKDSH_GATEWAY_CONNECT_TIMEOUT:-15s}
  WORKDSH_GATEWAY_RESPONSE_TIMEOUT: ${WORKDSH_GATEWAY_RESPONSE_TIMEOUT:-5m}
  WORKDSH_GATEWAY_STREAM_IDLE_TIMEOUT: ${WORKDSH_GATEWAY_STREAM_IDLE_TIMEOUT:-5m}
  WORKDSH_GATEWAY_MAX_RESPONSE_DURATION: ${WORKDSH_GATEWAY_MAX_RESPONSE_DURATION:-30m}
  WORKDSH_GATEWAY_MAX_CONCURRENT_REQUESTS: ${WORKDSH_GATEWAY_MAX_CONCURRENT_REQUESTS:-2000}
  WORKDSH_VIRTUAL_THREADS: ${WORKDSH_VIRTUAL_THREADS:-true}
  WORKDSH_GATEWAY_CACHE_TTL: ${WORKDSH_GATEWAY_CACHE_TTL:-10s}
  # 数据库连接池（可选；SQLite 固定 1 个连接）
  WORKDSH_DB_POOL_SIZE: ${WORKDSH_DB_POOL_SIZE:-10}
  WORKDSH_DB_CONNECTION_TIMEOUT_MS: ${WORKDSH_DB_CONNECTION_TIMEOUT_MS:-30000}
  # 会话正文存储（可选）：database 或 s3
  WORKDSH_BODY_STORE: ${WORKDSH_BODY_STORE:-database}
  WORKDSH_BODY_STORE_MIGRATE: ${WORKDSH_BODY_STORE_MIGRATE:-false}
  WORKDSH_BODY_S3_ENDPOINT: ${WORKDSH_BODY_S3_ENDPOINT:-}
  WORKDSH_BODY_S3_REGION: ${WORKDSH_BODY_S3_REGION:-us-east-1}
  WORKDSH_BODY_S3_BUCKET: ${WORKDSH_BODY_S3_BUCKET:-}
  WORKDSH_BODY_S3_PREFIX: ${WORKDSH_BODY_S3_PREFIX:-}
  WORKDSH_BODY_S3_ACCESS_KEY: ${WORKDSH_BODY_S3_ACCESS_KEY:-}
  WORKDSH_BODY_S3_SECRET_KEY: ${WORKDSH_BODY_S3_SECRET_KEY:-}
  WORKDSH_BODY_S3_PATH_STYLE: ${WORKDSH_BODY_S3_PATH_STYLE:-false}
  # 每日维护（可选）
  WORKDSH_MAINTENANCE_CRON: ${WORKDSH_MAINTENANCE_CRON:-0 30 3 * * *}
  WORKDSH_MAINTENANCE_ZONE: ${WORKDSH_MAINTENANCE_ZONE:-Asia/Shanghai}

services:
  admin:
    build:
      context: .
      dockerfile: deploy/docker/AdminBuild.Dockerfile
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:-maven:3.9-eclipse-temurin-21}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:21-jre}
    image: ${WORKDSH_ADMIN_IMAGE:-workdsh-admin:local}
    ports:
      # 默认仅绑定回环地址；需要局域网访问时设置 WORKDSH_ADMIN_BIND_ADDRESS=0.0.0.0。
      - "${WORKDSH_ADMIN_BIND_ADDRESS:-127.0.0.1}:${WORKDSH_ADMIN_PORT:-18890}:18890"
    environment: *admin-environment
    volumes:
      - workdsh-state:/state/data
    restart: unless-stopped

volumes:
  workdsh-state:
